<svg width="133" height="134" viewBox="0 0 133 134" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g opacity="0.85">
    <circle cx="15" cy="20" r="2" fill="#0E9AA7" opacity="0.6"/>
    <circle cx="125" cy="118" r="2.5" fill="#2563EB" opacity="0.5"/>
    <path d="M18 6V12M15 9H21" stroke="#0E9AA7" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M118 20V26M115 23H121" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Mobile Chat / Consultation Frame -->
  <rect x="18" y="14" width="76" height="116" rx="12" fill="white" stroke="#E2E8F0" stroke-width="0.8"/>
  <rect x="36" y="18" width="40" height="4" rx="2" fill="#CBD5E1"/>

  <!-- Top Doctor Profile in Chat -->
  <rect x="24" y="27" width="64" height="20" rx="8" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="0.6"/>
  <circle cx="34" cy="37" r="6" fill="#0E9AA7"/>
  <circle cx="34" cy="35" r="2.5" fill="white"/>
  <path d="M30 40.5C30.5 38.5 32 38.5 34 38.5C36 38.5 37.5 38.5 38 40.5" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="38" cy="41" r="1.5" fill="#10B981" stroke="white" stroke-width="0.5"/>
  <rect x="44" y="33" width="28" height="3.5" rx="1.5" fill="#1E293B"/>
  <rect x="44" y="38" width="18" height="2.5" rx="1" fill="#94A3B8"/>

  <!-- Doctor message bubble (incoming) -->
  <path d="M24 53C24 50.7909 25.7909 49 28 49H68C70.2091 49 72 50.7909 72 53V63C72 65.2091 70.2091 67 68 67H28L24 70V53Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.6"/>
  <rect x="30" y="54" width="34" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="30" y="59" width="24" height="2.5" rx="1" fill="#94A3B8"/>

  <!-- Patient message bubble (outgoing) -->
  <path d="M88 74C88 71.7909 86.2091 70 84 70H48C45.7909 70 44 71.7909 44 74V84C44 86.2091 45.7909 88 48 88H84L88 91V74Z" fill="url(#chat_grad)" />
  <rect x="50" y="75" width="28" height="3" rx="1.5" fill="white"/>
  <rect x="50" y="80" width="20" height="2.5" rx="1" fill="white" fill-opacity="0.85"/>
  <!-- Checkmark on sent msg -->
  <path d="M78 81L80 83L83 79" stroke="white" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Doctor Voice/Attachment bubble (incoming) -->
  <rect x="24" y="94" width="54" height="15" rx="7.5" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="0.6"/>
  <circle cx="31.5" cy="101.5" r="4.5" fill="#0E9AA7"/>
  <path d="M30 99.5L34 101.5L30 103.5V99.5Z" fill="white"/>
  <path d="M40 101.5H68" stroke="#0E9AA7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Floating Video/Call Badge -->
  <g filter="url(#shadow)">
    <rect x="74" y="32" width="46" height="42" rx="10" fill="white" stroke="#E2E8F0" stroke-width="0.6"/>
    <circle cx="97" cy="49" r="11" fill="url(#shield_grad)"/>
    <!-- Video camera icon -->
    <rect x="91" y="45" width="8" height="8" rx="1.5" fill="white"/>
    <path d="M99 47L103 45V53L99 51V47Z" fill="white"/>
    <!-- Pulse badge -->
    <rect x="85" y="64" width="24" height="3" rx="1.5" fill="#10B981"/>
  </g>

  <!-- Floating Prescription badge -->
  <g>
    <rect x="70" y="90" width="48" height="28" rx="8" fill="white" stroke="#E2E8F0" stroke-width="0.6"/>
    <circle cx="80" cy="104" r="5" fill="#2563EB" fill-opacity="0.15"/>
    <path d="M78 104L80 106L83 102" stroke="#2563EB" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="89" y="100" width="22" height="3" rx="1.5" fill="#1E293B"/>
    <rect x="89" y="105" width="14" height="2" rx="1" fill="#94A3B8"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="chat_grad" x1="44" y1="70" x2="88" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E9AA7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shield_grad" x1="86" y1="38" x2="108" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>

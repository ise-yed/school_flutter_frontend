<svg width="133" height="134" viewBox="0 0 133 134" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g opacity="0.85">
    <circle cx="16" cy="18" r="2" fill="#0E9AA7" opacity="0.6"/>
    <circle cx="126" cy="116" r="2.5" fill="#2563EB" opacity="0.5"/>
    <path d="M16 6V12M13 9H19" stroke="#0E9AA7" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M120 22V28M117 25H123" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Main Calendar Base Card -->
  <rect x="20" y="18" width="76" height="108" rx="14" fill="white" stroke="#E2E8F0" stroke-width="0.8"/>
  
  <!-- Calendar Header -->
  <path d="M20 32C20 24.268 26.268 18 34 18H82C89.732 18 96 24.268 96 32V38H20V32Z" fill="url(#cal_head)"/>
  
  <!-- Binder Rings -->
  <rect x="36" y="13" width="5" height="10" rx="2.5" fill="#0D828E"/>
  <rect x="75" y="13" width="5" height="10" rx="2.5" fill="#0D828E"/>
  <circle cx="38.5" cy="18" r="1.5" fill="white"/>
  <circle cx="77.5" cy="18" r="1.5" fill="white"/>

  <!-- Calendar Month Title lines -->
  <rect x="47" y="26" width="22" height="4" rx="2" fill="white"/>

  <!-- Calendar Grid Slots -->
  <!-- Row 1 -->
  <circle cx="32" cy="48" r="3.5" fill="#F1F5F9"/>
  <circle cx="45" cy="48" r="3.5" fill="#F1F5F9"/>
  <circle cx="58" cy="48" r="3.5" fill="#F1F5F9"/>
  <circle cx="71" cy="48" r="3.5" fill="#F1F5F9"/>
  <circle cx="84" cy="48" r="3.5" fill="#F1F5F9"/>

  <!-- Row 2 -->
  <circle cx="32" cy="60" r="3.5" fill="#F1F5F9"/>
  <circle cx="45" cy="60" r="3.5" fill="#F1F5F9"/>
  <!-- Selected / Active Date Slot (Glowing) -->
  <rect x="52" y="54" width="12" height="12" rx="4" fill="url(#slot_grad)"/>
  <circle cx="58" cy="60" r="2" fill="white"/>
  <circle cx="71" cy="60" r="3.5" fill="#F1F5F9"/>
  <circle cx="84" cy="60" r="3.5" fill="#F1F5F9"/>

  <!-- Row 3 -->
  <circle cx="32" cy="72" r="3.5" fill="#F1F5F9"/>
  <circle cx="45" cy="72" r="3.5" fill="#F1F5F9"/>
  <circle cx="58" cy="72" r="3.5" fill="#F1F5F9"/>
  <circle cx="71" cy="72" r="3.5" fill="#F1F5F9"/>
  <circle cx="84" cy="72" r="3.5" fill="#F1F5F9"/>

  <!-- Divider Line -->
  <line x1="26" y1="82" x2="90" y2="82" stroke="#E2E8F0" stroke-width="0.6"/>

  <!-- Today's Appointment summary card inside calendar -->
  <rect x="25" y="87" width="66" height="30" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.5"/>
  <circle cx="35" cy="102" r="5" fill="#0E9AA7" fill-opacity="0.15"/>
  <!-- Clock hands -->
  <path d="M35 99.5V102H37.5" stroke="#0E9AA7" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="97" width="28" height="3" rx="1.5" fill="#1E293B"/>
  <rect x="44" y="103" width="38" height="2.5" rx="1" fill="#94A3B8"/>
  <circle cx="85" cy="98.5" r="2" fill="#10B981"/>

  <!-- Floating Bell / Alert Badge (Top Right) -->
  <g>
    <rect x="78" y="28" width="46" height="46" rx="12" fill="white" stroke="#E2E8F0" stroke-width="0.6"/>
    <circle cx="101" cy="51" r="14" fill="url(#bell_grad)"/>
    <!-- Bell icon -->
    <path d="M101 44C98.5 44 97 45.8 97 48.5V52.5L95.5 54.5H106.5L105 52.5V48.5C105 45.8 103.5 44 101 44Z" fill="white"/>
    <path d="M99.5 56C99.5 56.8 100.2 57.5 101 57.5C101.8 57.5 102.5 56.8 102.5 56" stroke="white" stroke-width="0.8"/>
    <!-- Red notification badge -->
    <circle cx="109" cy="43" r="3.5" fill="#EF4444" stroke="white" stroke-width="1"/>
  </g>

  <!-- Floating Stethoscope / Verified Badge (Bottom Right) -->
  <g>
    <rect x="76" y="86" width="44" height="36" rx="10" fill="white" stroke="#E2E8F0" stroke-width="0.6"/>
    <circle cx="87" cy="104" r="6" fill="#10B981" fill-opacity="0.15"/>
    <path d="M84.5 104L86.5 106L89.5 102" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="99" width="18" height="3" rx="1.5" fill="#1E293B"/>
    <rect x="96" y="105" width="12" height="2" rx="1" fill="#94A3B8"/>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="cal_head" x1="20" y1="18" x2="96" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E9AA7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="slot_grad" x1="52" y1="54" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E9AA7"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="bell_grad" x1="87" y1="37" x2="115" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>
